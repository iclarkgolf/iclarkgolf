<script>
/* 짧은 견적서 주소: iclarkgolf.com/q/261028 → 견적서 QT-20261028-001
                    iclarkgolf.com/q/261028-2 → 견적서 QT-20261028-002 */
(function(){
  var m = location.pathname.match(/^\/q\/(\d{6})(?:-(\d{1,3}))?\/?$/);
  if (m) {
    var seq = ('00' + (m[2] || '1')).slice(-3);
    location.replace('/my-quote.html?id=QT-20' + m[1] + '-' + seq);
  }
})();
</script>
