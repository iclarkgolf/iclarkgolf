// ── 수강 신청 → PJ가 "입금 확인"한 건을 내 크레딧으로 자동 반영 (pricing·mypage·booking 공통) ──
async function claimPaidEnrollments(uid){
  try{
    const snap = await db.collection('enrollRequests').where('uid', '==', uid).get();
    const targets = snap.docs.filter(d => { const r = d.data(); return r.status === 'paid' && !r.claimed; });
    for(const d of targets){
      const ref = d.ref;
      await db.runTransaction(async tx => {
        const cur = await tx.get(ref);
        const r = cur.exists ? cur.data() : null;
        if(!r || r.status !== 'paid' || r.claimed) return;   // 이미 반영된 건은 건너뜀 (중복 충전 방지)
        const sessions = Number(r.sessions) || 0;
        if(!sessions) return;
        const expiresAt = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000);
        tx.set(db.collection('users').doc(uid).collection('creditLots').doc(), {
          packageType: String(r.packageType || ''),
          totalSessions: sessions,
          remainingSessions: sessions,
          pricePaid: Number(r.price) || 0,
          regularPricePerSession: 30000,
          purchasedAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt),
          enrollRequestId: ref.id
        });
        tx.set(db.collection('users').doc(uid).collection('history').doc(), {
          type: 'credit_purchase',
          text: `${sessions}회권 충전 완료 (${sessions}-lesson pack)`,
          sub: '₩' + Number(r.price || 0).toLocaleString('en-US'),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        tx.update(ref, { claimed: true, claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
    }
  }catch(e){ console.error('입금 확인된 수강권 반영 실패:', e); }
}

async function loadCreditInfo(uid){
  try{
    const snap = await db.collection('users').doc(uid).collection('creditLots').get();
    const now = new Date();
    const lots = [];
    snap.forEach(doc => {
      const d = doc.data();
      const expiresAt = d.expiresAt && d.expiresAt.toDate ? d.expiresAt.toDate() : null;
      const purchasedAt = d.purchasedAt && d.purchasedAt.toDate ? d.purchasedAt.toDate() : new Date(0);
      const remaining = d.remainingSessions || 0;
      if(remaining > 0 && (!expiresAt || expiresAt > now)){
        // 정산용 실제 1회 단가 (5회권 30,000 / 10회권 27,000) — 기록이 없으면 정가 30,000
        const unitPrice = (Number(d.pricePaid) > 0 && Number(d.totalSessions) > 0)
          ? Math.round(Number(d.pricePaid) / Number(d.totalSessions)) : 30000;
        lots.push({ ref: doc.ref, remaining, purchasedAt, unitPrice });
      }
    });
    lots.sort((a, b) => a.purchasedAt - b.purchasedAt); // 오래된 크레딧부터 먼저 사용 (FIFO)
    availableLots = lots;
    creditBalance = lots.reduce((sum, l) => sum + l.remaining, 0);
  }catch(err){
    console.error('크레딧 정보 로드 실패:', err);
    creditBalance = 0;
    availableLots = [];
  }
}

function dayHasOpenSlot(dayId){
  const avail = (tutorData.availability && tutorData.availability[dayId]) || [];
  const booked = (tutorData.bookedSlots && tutorData.bookedSlots[dayId]) || [];
  return avail.some(t => !booked.includes(t));
}

    btn.className = 'day' + (selectedDay === d.id ? ' selected' : '') + (hasOpen ? '' : ' disabled');

    if(hasOpen){
      btn.addEventListener('click', () => { selectedDay = d.id; selectedTime = null; renderDays(); renderSlots(); updatePayState(); });
    }
    container.appendChild(btn);
  });
}

    return;
  }
  const avail = (tutorData.availability && tutorData.availability[selectedDay]) || [];
  const booked = (tutorData.bookedSlots && tutorData.bookedSlots[selectedDay]) || [];
  const openTimes = TIMES.filter(t => avail.includes(t));

  if(openTimes.length === 0){
    emptyNote.textContent = tr('booking.noSlots');
    emptyNote.style.display = 'block';
    return;
  }
  emptyNote.style.display = 'none';

  openTimes.forEach(time => {
    const isBooked = booked.includes(time);
    const btn = document.createElement('button');
    btn.className = 'slot' + (selectedTime === time ? ' selected' : '') + (isBooked ? ' booked' : '');
    btn.textContent = time;
    if(!isBooked){
      btn.addEventListener('click', () => { selectedTime = time; renderSlots(); updatePayState(); });
    }
    container.appendChild(btn);
  });
}

function updatePayState(){
  const payBtn = document.getElementById('payBtn');
  if(payBtn) payBtn.disabled = !(selectedDay && selectedTime);
}

function renderTutorSummary(){
  if(!tutorData) return;
  const koS = tutorData.ko || {};
  const localized = tutorData[currentLang] || {};
  const d = {
    name: localized.name || koS.name,
    role: localized.role || koS.role
  };
  const avatarEl = document.getElementById('tutorAvatar');
  if(tutorData.avatarImage){
    avatarEl.style.background = `url('${tutorData.avatarImage}') center/cover`;
  }else{
    avatarEl.style.background = tutorData.avatarColor || '#3b5f8f';
  }
  const withText = ({
    ko: `${d.name} 튜터와 1회 수업`,
    en: `1 lesson with tutor ${d.name}`,
    ja: `${d.name}講師と1回の授業`
  })[currentLang];
  document.getElementById('tutorSummaryName').textContent = withText;
  document.getElementById('tutorSummaryType').textContent = d.role || '';

  const price = SESSION_PRICE; // 튜터별 개별 가격 대신 통일된 정가 사용
  document.getElementById('feeText').textContent = fmtKRW(price);

  const discountRow = document.getElementById('discountRow');
  const payBtn = document.getElementById('payBtn');

  if(isFirstLesson){
    currentFinalPrice = 0;
    discountRow.style.display = 'flex';
    document.getElementById('discountLabel').textContent = ({
      ko: '첫 수업 무료 오리엔테이션',
      en: 'First lesson free (orientation)',
      ja: '初回無料オリエンテーション'
    })[currentLang];
    document.getElementById('discountText').textContent = '-' + fmtKRW(price);
    payBtn.textContent = ({
      ko: '무료로 예약 확정', en: 'Confirm free booking', ja: '無料で予約を確定する'
    })[currentLang];
  }else{
    currentFinalPrice = price;
    discountRow.style.display = 'none';
    if(creditBalance > 0){
      payBtn.textContent = ({
        ko: '크레딧 1회 사용하고 예약 확정',
        en: 'Use 1 credit and confirm booking',
        ja: 'クレジット1回分を使って予約を確定する'
      })[currentLang];
    }else{
      payBtn.textContent = tr('booking.goCharge');
    }
  }
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  const langCur = document.getElementById('langCur');
  if(langCur){
    const LANG_LABELS = { ko: '한국어', en: 'English', ja: '日本語' };
    langCur.textContent = LANG_LABELS[lang] || LANG_LABELS.ko;
    document.querySelectorAll('.lang-menu .lang-option').forEach(el => {
      el.classList.toggle('active', el.getAttribute('data-lang') === lang);
    });
  }
  localStorage.setItem('malmun_lang', lang);
  if(tutorData){
    renderDays();
    renderSlots();
    renderTutorSummary();
  }
}

function toggleLangMenu(e){
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
}
function setLang(e, lang){
  e.stopPropagation();
  applyLang(lang);
  document.getElementById('langMenu').classList.remove('open');
}
document.addEventListener('click', () => {
  const menu = document.getElementById('langMenu');
  if(menu) menu.classList.remove('open');
});

async function handleConfirm(){
  if(!selectedDay || !selectedTime) return;
  const user = auth.currentUser;
  if(!user){
    location.href = 'login.html?next=booking&tutor=' + currentTutorId;
    return;
  }
  if(!isFirstLesson && creditBalance < 1){
    alert(tr('booking.noCreditMsg'));
    location.href = 'pricing.html';
    return;
  }
  const dayObj = DAYS.find(d => d.id === selectedDay);
  const dayLabel = dayObj[currentLang] || dayObj.ko;
  const koC = tutorData.ko || {};
  const localizedC = tutorData[currentLang] || {};
  const tutorName = localizedC.name || koC.name;

  // 이 예약 하나에만 쓰이는 고유 화상룸 ID (튜터+요일+시간+타임스탬프 조합으로 절대 겹치지 않게 생성)
  const roomId = `${currentTutorId}-${selectedDay}${selectedTime.replace(':','')}-${Date.now().toString(36)}`;

  let usedUnitPrice = 0, usedLotId = '';   // 정산용 (2026-11-07)
  try{
    // 무료 오리엔테이션이 아니면, 가장 오래된 크레딧부터 1회 차감 (FIFO)
    if(!isFirstLesson){
      const lot = availableLots.find(l => l.remaining > 0);
      if(!lot){
        alert(tr('booking.noCreditMsg'));
        location.href = 'pricing.html';
        return;
      }
      await lot.ref.update({ remainingSessions: firebase.firestore.FieldValue.increment(-1) });
      lot.remaining -= 1;
      creditBalance -= 1;
      usedUnitPrice = lot.unitPrice || 30000;
      usedLotId = lot.ref.id;
    }

    await db.collection('users').doc(user.uid).collection('history').add({
      type: 'booking',
      text: isFirstLesson
        ? ({
            ko: `${tutorName} 튜터와 무료 오리엔테이션 예약 완료`,
            en: `Booked a free orientation with ${tutorName}`,
            ja: `${tutorName}講師との無料オリエンテーション予約完了`
          })[currentLang]
        : ({
            ko: `${tutorName} 튜터 예약 완료 (크레딧 1회 사용)`,
            en: `Booked a lesson with ${tutorName} (1 credit used)`,
            ja: `${tutorName}講師の予約完了（クレジット1回分使用）`
          })[currentLang],
      sub: `${dayLabel} ${selectedTime}`,
      tutorId: currentTutorId,
      tutorName: tutorName,
      day: selectedDay,
      time: selectedTime,
      price: currentFinalPrice,
      unitPrice: usedUnitPrice,
      creditLotId: usedLotId,
      isFreeOrientation: isFirstLesson,
      roomId: roomId,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    // 튜터가 예약 목록을 확인할 수 있도록 최상위 bookings 컬렉션에도 동일하게 기록
    try{
      await db.collection('bookings').add({
        tutorId: currentTutorId,
        tutorName: tutorName,
        studentUid: user.uid,
        studentName: user.displayName || (user.email ? user.email.split('@')[0] : '학생'),
        studentEmail: user.email || '',
        day: selectedDay,
        dayLabel: dayLabel,
        time: selectedTime,
        price: currentFinalPrice,
        unitPrice: usedUnitPrice,
        creditLotId: usedLotId,
        isFreeOrientation: isFirstLesson,
        roomId: roomId,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      });
    }catch(bookingListErr){
      console.error('튜터용 예약 목록 저장 실패 (학생 예약 자체는 완료됨):', bookingListErr);
    }

    // PJ님께 즉시 이메일 알림 (실패해도 예약 자체는 정상 처리되도록 별도 try/catch)
    try{
      fetch(BOOKING_ALERT_WEBAPP_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({
          studentName: user.displayName || (user.email ? user.email.split('@')[0] : '학생'),
          studentEmail: user.email || '',
          tutorName: tutorName,
          dayLabel: dayLabel,
          time: selectedTime,
          price: currentFinalPrice,
          isFreeOrientation: isFirstLesson,
          joinUrl: `https://malmunkorean.com/classroom.html?room=${roomId}&tutor=${encodeURIComponent(tutorName)}&time=${encodeURIComponent(dayLabel + ' ' + selectedTime)}`
        })
      });
    }catch(alertErr){
      console.error('예약 알림 이메일 발송 실패(예약 자체는 정상 완료됨):', alertErr);
    }

    // 해당 요일·시간을 다른 학생이 다시 예약하지 못하도록 잠금 처리
    try{
      await db.collection('tutors').doc(currentTutorId).update({
        [`bookedSlots.${selectedDay}`]: firebase.firestore.FieldValue.arrayUnion(selectedTime)
      });
    }catch(lockErr){
      console.error('예약 슬롯 잠금 실패 (예약 자체는 완료됨):', lockErr);
    }

    alert(({
      ko: '예약이 확정되었습니다!', en: 'Your booking is confirmed!', ja: '予約が確定しました！'
    })[currentLang]);
    if(window.gtag){ gtag('event', 'student_booking_complete'); }
    location.href = 'mypage.html';
  }catch(err){
    console.error('예약 저장 실패:', err);
    alert(({
      ko: '예약 중 오류가 발생했습니다: ', en: 'Something went wrong: ', ja: '予約中にエラーが発生しました：'
    })[currentLang] + err.message);
  }
}

async function loadTutor(){
  if(!currentTutorId){
    document.getElementById('bookingBody').innerHTML = `<p class="loading">${tr('booking.notFound')}</p>`;
    return;
  }
  try{
    const doc = await db.collection('tutors').doc(currentTutorId).get();
    tutorData = doc.exists ? doc.data() : null;
  }catch(err){
    console.error('튜터 정보 로드 실패:', err);
    tutorData = null;
  }

  if(!tutorData){
    document.getElementById('bookingBody').innerHTML = `<p class="loading">${tr('booking.notFound')}</p>`;
    return;
  }

  buildBookingUI();
  applyLang(currentLang);
  renderDays();
  renderSlots();
  renderTutorSummary();
  updatePayState();
  if(window.gtag){ gtag('event', 'student_booking_view'); }
}

loadTutor();
</script>
