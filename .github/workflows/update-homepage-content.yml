name: Auto-update homepage packages & lodging (agoda)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-homepage-content:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install firebase-admin
        run: npm install firebase-admin@12

      - name: mirror imgbb photos into this site (imgbb 사진을 우리 사이트로 복사·주소 교체)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/mirror-images.js
        timeout-minutes: 8
        continue-on-error: true

      - name: build homepage content
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/build-homepage-content.js

      - name: build package detail pages (검색엔진용 정적 페이지)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/build-package-pages.js

      - name: build used-shop facebook preview pages (중고장터 페이스북 미리보기)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/build-shop-pages.js

      - name: rebuild sitemap.xml (새 패키지 페이지 포함)
        run: node .github/scripts/build-sitemap.js

      - name: commit changes
        run: |
          git config user.name "iclarkgolf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html package-*.html packages-manifest.json sitemap.xml
          git add shop-manifest.json
          git add -A -- 'shop-*.html' || true
          git add -A images/m || true
          git add -u -- '*.html' || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update homepage + package detail pages + sitemap"
            git push
          fi
