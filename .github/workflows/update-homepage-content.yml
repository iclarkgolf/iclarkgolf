name: Auto-update homepage packages & lodging (agoda)

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# 같은 자동 작업이 겹쳐서 돌지 않게 함
concurrency:
  group: update-homepage-content
  cancel-in-progress: false

jobs:
  update-homepage-content:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: install firebase-admin
        run: npm install firebase-admin@12

      - name: mirror imgbb photos into this site (imgbb 사진을 우리 사이트로 복사·주소 교체)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/mirror-images.js
        timeout-minutes: 8
        continue-on-error: true

      - name: build homepage content
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/build-homepage-content.js

      - name: build package detail pages (검색엔진용 정적 페이지)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/build-package-pages.js

      - name: build used-shop facebook preview pages (중고장터 페이스북 미리보기)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/build-shop-pages.js

      - name: rebuild sitemap.xml (새 패키지 페이지 포함)
        run: node .github/scripts/build-sitemap.js

      - name: commit changes
        run: |
          git config user.name "iclarkgolf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html package-*.html packages-manifest.json sitemap.xml
          git add shop-manifest.json
          git add -A -- 'shop-*.html' || true
          git add -A images/m || true
          git add -u -- '*.html' || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "auto update homepage + package detail pages + sitemap"
          # PJ가 같은 시간에 파일을 올려도 실패하지 않도록: 최신 상태를 받아 다시 저장 (최대 3번)
          for i in 1 2 3; do
            if git push; then
              echo "pushed"
              exit 0
            fi
            echo "push rejected - 최신 상태 받아서 다시 시도 ($i)"
            if ! git pull --rebase; then
              git rebase --abort || true
              echo "같은 파일이 동시에 바뀜 - 이번 회차는 건너뛰고 다음 자동 작업(6시간 후)에서 처리"
              exit 0
            fi
            sleep 5
          done
          echo "3번 시도 후에도 저장 실패 - 다음 자동 작업에서 다시 처리"
          exit 0
