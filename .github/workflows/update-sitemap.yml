name: Auto-update sitemap & blog list

# posts-data.js가 바뀌어서(=새 블로그 글 등록) main 브랜치에 push되면
# sitemap.xml과 blog.html의 글 목록을 자동으로 재생성하고 다시 커밋합니다.
# PJ님은 평소처럼 posts-data.js만 GitHub에서 수정하면 됩니다 — 그 이후는 전부 자동.

on:
  push:
    branches: [main]
    paths:
      - 'posts-data.js'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: sitemap.xml + blog.html 재생성
        run: node .github/scripts/build-sitemap.js

      - name: 변경사항 커밋
        run: |
          git config user.name "iclarkgolf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sitemap.xml blog.html
          if git diff --cached --quiet; then
            echo "변경사항 없음 — 커밋 생략"
          else
            git commit -m "🤖 sitemap.xml / blog.html 자동 갱신 (posts-data.js 변경 반영)"
            git push
          fi
