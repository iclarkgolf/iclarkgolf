name: Update Agoda hotel data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-agoda-data:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: fetch agoda data
        env:
          AGODA_SITE_ID: ${{ secrets.AGODA_SITE_ID }}
          AGODA_API_KEY: ${{ secrets.AGODA_API_KEY }}
        run: node .github/scripts/fetch-agoda-data.js

      - name: commit changes
        run: |
          git config user.name "iclarkgolf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add agoda-hotels.json
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "auto update agoda hotel data"
            git push
          fi
