<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>요금제·패키지 | 말문 Malmun</title>
<meta name="description" content="말문의 한국어 1:1 튜터링 크레딧 패키지를 확인하세요. 5회권·10회권 중 골라 충전하고, 원하는 튜터와 자유롭게 예약하세요.">
<link rel="canonical" href="https://malmunkorean.com/pricing.html">
<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:0 20px 40px; }

  .topbar{ padding:24px 0 20px; display:flex; align-items:center; justify-content:space-between; }
  .topbar button{ background:none; border:none; color:var(--text-secondary); cursor:pointer; padding:0; display:flex; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }

  .header{ padding:0 0 20px; }
  .header .title{ font-size:17px; font-weight:600; margin:0 0 6px; }
  .header .sub{ font-size:13px; color:var(--text-muted); margin:0; }

  .balance-card{
    background:var(--accent-soft); border:1px solid var(--card-border); border-radius:14px;
    padding:16px; margin-bottom:20px; display:none;
  }
  .balance-card .row{ display:flex; justify-content:space-between; align-items:baseline; }
  .balance-card .num{ font-size:22px; font-weight:700; color:var(--accent-text); }
  .balance-card .label{ font-size:12px; color:var(--text-secondary); }
  .balance-card .expiry{ font-size:11px; color:var(--text-muted); margin-top:6px; }

  .cards{ display:flex; flex-direction:column; gap:12px; }
  .price-card{
    border:1px solid var(--card-border); border-radius:14px; padding:16px;
    background:var(--card); text-align:left; width:100%; color:var(--text); cursor:pointer; position:relative;
  }
  .price-card.featured{ border:2px solid var(--accent); }
  .badge{ position:absolute; top:-10px; left:16px; background:var(--accent); color:var(--accent-text); font-size:11px; font-weight:600; padding:3px 10px; border-radius:8px; }
  .price-card .name{ font-size:14px; font-weight:700; margin:8px 0 4px; }
  .price-card .sub{ font-size:12px; color:var(--text-muted); margin:0 0 10px; }
  .price-card .amount{ font-size:19px; font-weight:700; }
  .price-card .amount .orig{ font-size:13px; color:var(--text-muted); font-weight:400; text-decoration:line-through; margin-right:6px; }
  .price-card .unit{ font-size:12px; color:var(--text-muted); font-weight:400; }

  .note{ border:1px dashed var(--card-border); border-radius:14px; padding:14px; margin-top:12px; }
  .note p{ font-size:12px; color:var(--text-muted); line-height:1.6; margin:0 0 6px; }
  .note p:last-child{ margin-bottom:0; }

  .modal-overlay{
    display:none; position:fixed; inset:0; background:rgba(44,44,42,0.5);
    align-items:flex-end; justify-content:center; z-index:100;
  }
  .modal-overlay.open{ display:flex; }
  .modal{
    background:var(--card); border-radius:20px 20px 0 0; padding:24px 20px 28px;
    max-width:480px; width:100%; max-height:80vh; overflow-y:auto;
  }
  .modal h3{ font-size:16px; margin:0 0 8px; }
  .modal p{ font-size:13px; color:var(--text-secondary); line-height:1.6; margin:0 0 16px; }
  .modal .price-line{ display:flex; justify-content:space-between; font-size:14px; margin-bottom:8px; }
  .modal .price-line.total{ font-weight:700; font-size:16px; border-top:1px solid var(--card-border); padding-top:12px; margin-top:8px; }
  .modal .test-note{ background:var(--accent-soft); border-radius:10px; padding:12px; font-size:12px; color:var(--accent-text); margin:16px 0; }
  .modal-btn{
    display:block; width:100%; text-align:center; padding:14px; border-radius:12px;
    font-size:15px; font-weight:600; cursor:pointer; border:none; margin-top:8px;
    background:var(--accent); color:var(--accent-text);
  }
  .modal-btn.secondary{ background:none; color:var(--text-secondary); border:1px solid var(--card-border); }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <button onclick="location.href='mypage.html'" aria-label="뒤로가기">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <button id="langToggle" aria-label="언어 전환">
      <span class="cur" id="langCur">한국어</span> / <span id="langOther">EN</span>
    </button>
  </div>

  <div class="header">
    <p class="title" data-i18n="pricing.h.title">요금제·패키지</p>
    <p class="sub" data-i18n="pricing.h.sub">묶어서 충전하면 회당 가격이 낮아져요</p>
  </div>

  <div class="balance-card" id="balanceCard">
    <div class="row">
      <span class="label" data-i18n="pricing.balance.label">보유 크레딧</span>
      <span class="num"><span id="balanceNum">0</span><span data-i18n="pricing.balance.unit">회</span></span>
    </div>
    <p class="expiry" id="balanceExpiry"></p>
  </div>

  <div class="cards">
    <button class="price-card" onclick="openPurchaseModal('5')">
      <p class="name" data-i18n="pricing.pack5.name">5회권</p>
      <p class="sub" data-i18n="pricing.pack5.sub">가볍게 시작하고 싶다면</p>
      <p class="amount">₩150,000<span class="unit" data-i18n="pricing.pack5.unit"> · 회당 ₩30,000</span></p>
    </button>

    <button class="price-card featured" onclick="openPurchaseModal('10')">
      <div class="badge" data-i18n="pricing.popular">가장 많이 선택</div>
      <p class="name" data-i18n="pricing.pack10.name">10회권</p>
      <p class="sub" data-i18n="pricing.pack10.sub">10% 할인 · 꾸준히 배우고 싶다면</p>
      <p class="amount"><span class="orig">₩300,000</span>₩270,000<span class="unit" data-i18n="pricing.pack10.unit"> · 회당 ₩27,000</span></p>
    </button>
  </div>

  <div class="note">
    <p data-i18n="pricing.note1">크레딧은 어떤 튜터와도 자유롭게 사용할 수 있고, 충전일로부터 1년간 유효합니다.</p>
    <p data-i18n="pricing.note2">중도 환불 시, 이미 사용한 회차는 정가(회당 ₩30,000)로 계산해 공제한 뒤 남은 금액만 환불됩니다.</p>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">5회권 구매</h3>
    <p id="modalDesc"></p>
    <div class="price-line"><span data-i18n="pricing.modal.regular">정가</span><span id="modalRegular"></span></div>
    <div class="price-line" id="modalDiscountLine" style="display:none;"><span data-i18n="pricing.modal.discount">할인</span><span id="modalDiscount"></span></div>
    <div class="price-line total"><span data-i18n="pricing.modal.pay">결제 금액</span><span id="modalTotal"></span></div>
    <div class="test-note" id="testNote" data-i18n="pricing.modal.testNote">※ 아직 사업자 등록 전이라 실제 결제는 연결되어 있지 않아요. 지금 누르시면 테스트로 크레딧이 바로 충전됩니다 (실제 결제 연동 후 이 문구는 사라집니다).</div>
    <button class="modal-btn" id="confirmPurchaseBtn" data-i18n="pricing.modal.confirm">테스트로 충전하기</button>
    <button class="modal-btn secondary" onclick="closePurchaseModal()" data-i18n="pricing.modal.cancel">취소</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ── 크레딧 시스템 공통 상수 (booking.html, mypage.html과 동일하게 유지) ──
const SESSION_PRICE = 30000; // 통일된 회당 정가
const CREDIT_VALID_DAYS = 365; // 유효기간 1년

const PACKAGES = {
  '5':  { sessions: 5,  price: 150000 },
  '10': { sessions: 10, price: 270000 }
};

let currentLang = localStorage.getItem('malmun_lang') || 'ko';
let selectedPackage = null;

function fmtKRW(n){ return '₩' + Number(n || 0).toLocaleString('en-US'); }

const TRANSLATIONS = {
  ko: {
    "pricing.h.title": "요금제·패키지",
    "pricing.h.sub": "묶어서 충전하면 회당 가격이 낮아져요",
    "pricing.balance.label": "보유 크레딧",
    "pricing.balance.unit": "회",
    "pricing.pack5.name": "5회권",
    "pricing.pack5.sub": "가볍게 시작하고 싶다면",
    "pricing.pack5.unit": " · 회당 ₩30,000",
    "pricing.popular": "가장 많이 선택",
    "pricing.pack10.name": "10회권",
    "pricing.pack10.sub": "10% 할인 · 꾸준히 배우고 싶다면",
    "pricing.pack10.unit": " · 회당 ₩27,000",
    "pricing.note1": "크레딧은 어떤 튜터와도 자유롭게 사용할 수 있고, 충전일로부터 1년간 유효합니다.",
    "pricing.note2": "중도 환불 시, 이미 사용한 회차는 정가(회당 ₩30,000)로 계산해 공제한 뒤 남은 금액만 환불됩니다.",
    "pricing.modal.regular": "정가",
    "pricing.modal.discount": "할인",
    "pricing.modal.pay": "결제 금액",
    "pricing.modal.testNote": "※ 아직 사업자 등록 전이라 실제 결제는 연결되어 있지 않아요. 지금 누르시면 테스트로 크레딧이 바로 충전됩니다 (실제 결제 연동 후 이 문구는 사라집니다).",
    "pricing.modal.confirm": "테스트로 충전하기",
    "pricing.modal.cancel": "취소",
    "pricing.loginNeeded": "충전하려면 먼저 로그인해주세요",
    "pricing.purchaseDone": "크레딧이 충전되었습니다!"
  },
  en: {
    "pricing.h.title": "Pricing & packages",
    "pricing.h.sub": "Bundle up for a lower rate per lesson",
    "pricing.balance.label": "Your credits",
    "pricing.balance.unit": "",
    "pricing.pack5.name": "5-lesson pack",
    "pricing.pack5.sub": "Great way to start",
    "pricing.pack5.unit": " · ₩30,000/lesson",
    "pricing.popular": "Most popular",
    "pricing.pack10.name": "10-lesson pack",
    "pricing.pack10.sub": "10% off · For steady learners",
    "pricing.pack10.unit": " · ₩27,000/lesson",
    "pricing.note1": "Credits work with any tutor and stay valid for 1 year from purchase.",
    "pricing.note2": "If refunded early, used lessons are deducted at the regular rate (₩30,000 each) and only the remaining balance is refunded.",
    "pricing.modal.regular": "Regular price",
    "pricing.modal.discount": "Discount",
    "pricing.modal.pay": "Total",
    "pricing.modal.testNote": "※ Business registration is still pending, so real payment isn't connected yet. Clicking this will add test credits instantly (this notice will disappear once real payment is live).",
    "pricing.modal.confirm": "Add test credits",
    "pricing.modal.cancel": "Cancel",
    "pricing.loginNeeded": "Please log in first to purchase",
    "pricing.purchaseDone": "Credits added!"
  }
};

function tr(key){
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.ko;
  return dict[key] !== undefined ? dict[key] : key;
}

function applyLang(lang){
  currentLang = lang;
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  document.getElementById('langCur').textContent = (lang === 'ko') ? '한국어' : 'English';
  document.getElementById('langOther').textContent = (lang === 'ko') ? 'EN' : '한글';
  localStorage.setItem('malmun_lang', lang);
}

(function initLang(){
  applyLang(currentLang);
})();

document.getElementById('langToggle').addEventListener('click', () => {
  applyLang(currentLang === 'ko' ? 'en' : 'ko');
});

function openPurchaseModal(packId){
  selectedPackage = packId;
  const pack = PACKAGES[packId];
  const regular = pack.sessions * SESSION_PRICE;
  const discount = regular - pack.price;

  document.getElementById('modalTitle').textContent =
    (currentLang === 'ko' ? `${pack.sessions}회권 구매` : `Buy ${pack.sessions}-lesson pack`);
  document.getElementById('modalDesc').textContent =
    (currentLang === 'ko'
      ? `${pack.sessions}회분 크레딧이 충전되고, 충전일로부터 1년간 사용할 수 있어요.`
      : `${pack.sessions} lesson credits will be added, valid for 1 year from today.`);
  document.getElementById('modalRegular').textContent = fmtKRW(regular);
  if(discount > 0){
    document.getElementById('modalDiscountLine').style.display = 'flex';
    document.getElementById('modalDiscount').textContent = '-' + fmtKRW(discount);
  }else{
    document.getElementById('modalDiscountLine').style.display = 'none';
  }
  document.getElementById('modalTotal').textContent = fmtKRW(pack.price);
  document.getElementById('modalOverlay').classList.add('open');
}

function closePurchaseModal(){
  document.getElementById('modalOverlay').classList.remove('open');
}

async function confirmPurchase(){
  const user = auth.currentUser;
  if(!user){
    alert(tr('pricing.loginNeeded'));
    location.href = 'login.html?next=pricing';
    return;
  }
  const pack = PACKAGES[selectedPackage];
  const btn = document.getElementById('confirmPurchaseBtn');
  btn.disabled = true;

  try{
    const now = new Date();
    const expiresAt = new Date(now.getTime() + CREDIT_VALID_DAYS * 24 * 60 * 60 * 1000);

    await db.collection('users').doc(user.uid).collection('creditLots').add({
      packageType: selectedPackage,
      totalSessions: pack.sessions,
      remainingSessions: pack.sessions,
      pricePaid: pack.price,
      regularPricePerSession: SESSION_PRICE,
      purchasedAt: firebase.firestore.FieldValue.serverTimestamp(),
      expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt)
    });

    await db.collection('users').doc(user.uid).collection('history').add({
      type: 'credit_purchase',
      text: currentLang === 'ko'
        ? `${pack.sessions}회권 충전 완료 (테스트)`
        : `Purchased ${pack.sessions}-lesson pack (test)`,
      sub: fmtKRW(pack.price),
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });

    closePurchaseModal();
    alert(tr('pricing.purchaseDone'));
    loadBalance();
  }catch(err){
    console.error('크레딧 충전 실패:', err);
    alert((currentLang === 'ko' ? '오류가 발생했어요: ' : 'Something went wrong: ') + err.message);
  }finally{
    btn.disabled = false;
  }
}

document.getElementById('confirmPurchaseBtn').addEventListener('click', confirmPurchase);
document.getElementById('modalOverlay').addEventListener('click', (e) => {
  if(e.target === document.getElementById('modalOverlay')) closePurchaseModal();
});

function fmtDate(d){
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

async function loadBalance(){
  const user = auth.currentUser;
  if(!user) return;
  try{
    const snap = await db.collection('users').doc(user.uid).collection('creditLots').get();
    const now = new Date();
    let total = 0;
    let nearestExpiry = null;
    snap.forEach(doc => {
      const d = doc.data();
      const expiresAt = d.expiresAt && d.expiresAt.toDate ? d.expiresAt.toDate() : null;
      const remaining = d.remainingSessions || 0;
      if(remaining > 0 && (!expiresAt || expiresAt > now)){
        total += remaining;
        if(expiresAt && (!nearestExpiry || expiresAt < nearestExpiry)) nearestExpiry = expiresAt;
      }
    });
    if(total > 0){
      document.getElementById('balanceCard').style.display = 'block';
      document.getElementById('balanceNum').textContent = total;
      if(nearestExpiry){
        document.getElementById('balanceExpiry').textContent =
          (currentLang === 'ko' ? `가장 빠른 만료일: ${fmtDate(nearestExpiry)}` : `Earliest expiry: ${fmtDate(nearestExpiry)}`);
      }
    }
  }catch(err){
    console.error('크레딧 잔액 조회 실패:', err);
  }
}

auth.onAuthStateChanged(user => {
  if(user) loadBalance();
});
</script>

</body>
</html>
