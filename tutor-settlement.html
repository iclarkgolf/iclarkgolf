<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>튜터 정산 | 말문 관리</title>
<style>
  :root{
    --bg:#FFF9F0; --card:#FFFFFF; --card-border:#E8E4D8;
    --text:#2C2C2A; --text-secondary:#5F5E5A; --text-muted:#8A8880;
    --accent:#EF9F27; --accent-text:#412402; --accent-soft:#FFF3E0;
    --success:#3FA34D; --danger:#C0492B; --blue:#2B5BA8;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:720px; margin:0 auto; padding:22px 16px 60px; }
  h1{ font-size:19px; margin:0 0 4px; }
  .sub{ font-size:12px; color:var(--text-muted); margin:0 0 16px; line-height:1.6; }
  .back{ font-size:12px; color:var(--text-muted); text-decoration:underline; display:inline-block; margin-bottom:12px; }
  .card{ background:var(--card); border:1px solid var(--card-border); border-radius:14px; padding:16px; margin-bottom:12px; }
  .loading,.empty{ text-align:center; color:var(--text-muted); font-size:13px; padding:30px 0; }
  .btn{ padding:10px 14px; border-radius:10px; border:1.5px solid var(--text); background:#fff; color:var(--text);
    font-size:13px; font-weight:700; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:var(--text); color:#fff; }
  .btn.sm{ padding:6px 10px; font-size:12px; border-width:1px; }
  .btn.ok{ border-color:var(--success); color:var(--success); }
  .btn.no{ border-color:var(--danger); color:var(--danger); }
  .btn:disabled{ opacity:.45; cursor:default; }
  .monthbar{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; }
  .monthbar input{ padding:9px 10px; border:1px solid var(--card-border); border-radius:10px; font-size:14px; font-family:inherit; background:#fff; }
  .totals{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px; }
  .tot{ background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:10px 12px; }
  .tot small{ display:block; font-size:11px; color:var(--text-muted); }
  .tot b{ font-size:16px; }
  .tutor-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .t-name{ font-size:15px; font-weight:700; margin:0; }
  .t-meta{ font-size:12px; color:var(--text-muted); margin:3px 0 0; line-height:1.6; }
  .rows{ width:100%; border-collapse:collapse; margin-top:10px; font-size:13px; }
  .rows td{ padding:6px 0; border-top:1px solid var(--card-border); }
  .rows td:last-child{ text-align:right; font-weight:700; }
  .rows tr.big td{ font-size:15px; }
  .st{ display:inline-block; font-size:11px; padding:2px 7px; border-radius:8px; font-weight:600; }
  .st.ok{ background:#E4F4E7; color:var(--success); } .st.wait{ background:var(--accent-soft); color:var(--accent-text); }
  .st.dispute,.st.void{ background:#FBE7E1; color:var(--danger); } .st.paid{ background:#E3ECFA; color:var(--blue); } .st.free{ background:#F1F0EC; color:var(--text-muted); }
  .lesson{ border-top:1px dashed var(--card-border); padding:8px 0; font-size:12px; }
  .lesson .l1{ display:flex; justify-content:space-between; gap:8px; }
  .lesson .why{ color:var(--danger); margin:4px 0; }
  .detail{ display:none; margin-top:8px; }
  .detail.open{ display:block; }
  .acct{ font-size:12px; background:#F7F5EF; border-radius:8px; padding:6px 9px; margin-top:6px; display:inline-block; }
  .note{ font-size:11px; color:var(--text-muted); line-height:1.6; }
  @media (max-width:480px){ .totals{ grid-template-columns:1fr 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="admin.html">← 관리자 홈</a>
  <h1>💰 튜터 정산</h1>
  <p class="sub">수업료(실제 결제액)의 85%가 튜터 몫 · 학생 이의 없이 72시간 지나면 확정 · 매달 말일 마감, 다음 달 10일 지급</p>
  <div id="app"><p class="loading">불러오는 중...</p></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyD10IdHCDkCybMrkO5fewo0ksYFBmqwWro",
  authDomain: "malmun-bca03.firebaseapp.com",
  projectId: "malmun-bca03",
  storageBucket: "malmun-bca03.firebasestorage.app",
  messagingSenderId: "831462084669",
  appId: "1:831462084669:web:003a844918b165d5b65a54"
};
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try{ db.settings({ experimentalForceLongPolling: true, experimentalAutoDetectLongPolling: false, merge: true }); }catch(e){}

// 이 화면은 비밀번호 대신 PJ 구글 계정으로만 열림
const ADMIN_EMAILS = ['tourjang@gmail.com'];

const TUTOR_SHARE = 0.85;
const CONFIRM_HOURS = 72;
let lessons = [];          // completedLessons 전체
let tutorInfo = {};        // tutorId → { name, phone, payoutAccount }
let month = '';
const openSet = new Set();

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function won(n){ return (Number(n)||0).toLocaleString('ko-KR') + '원'; }
function kstMonth(d){ const k = new Date(d.getTime() + 9*3600e3); return k.getUTCFullYear() + '-' + String(k.getUTCMonth()+1).padStart(2,'0'); }
function isFreeLesson(l){ return !!(l.isFreeOrientation || l.isFreeTalk); }
function grossOf(l){ if(isFreeLesson(l)) return 0; if(typeof l.grossAmount === 'number') return l.grossAmount; return typeof l.unitPrice === 'number' ? l.unitPrice : 30000; }
function payOf(l){
  if(l.dispute && l.dispute.resolved === 'void') return 0;
  if(typeof l.tutorPay === 'number') return l.tutorPay;
  return Math.round(grossOf(l) * TUTOR_SHARE);
}
function monthOf(l){ return l.settleMonth || (l.completedAt && l.completedAt.toDate ? kstMonth(l.completedAt.toDate()) : ''); }
function payoutState(l){
  if(l.payoutStatus === 'paid') return { key:'paid', label:'지급 완료' };
  if(l.dispute && !l.dispute.resolved) return { key:'dispute', label:'학생 이의 접수' };
  if(l.dispute && l.dispute.resolved === 'void') return { key:'void', label:'지급 제외' };
  if(isFreeLesson(l)) return { key:'free', label:'무료 수업' };
  const t = l.completedAt && l.completedAt.toMillis ? l.completedAt.toMillis() : 0;
  if(!t || (Date.now() - t < CONFIRM_HOURS*3600e3 && !(l.dispute && l.dispute.resolved === 'pay'))) return { key:'wait', label:'확인 대기' };
  return { key:'ok', label:'확정' };
}
// 사업소득 원천징수: 소득세 3% + 지방소득세(소득세의 10%), 각 10원 미만 버림, 소득세 1,000원 미만이면 징수 안 함
function withholding(pay){
  const it = Math.floor(pay * 0.03 / 10) * 10;
  if(it < 1000) return { it:0, lt:0, total:0 };
  const lt = Math.floor(it * 0.1 / 10) * 10;
  return { it, lt, total: it + lt };
}
function fmtDate(ts){
  if(!ts || !ts.toDate) return '';
  const d = ts.toDate();
  return `${d.getMonth()+1}/${d.getDate()}`;
}

/* ───── 로그인 (PJ 구글 계정만) ───── */
auth.onAuthStateChanged(user => {
  if(!user){ renderLogin(); return; }
  if(!ADMIN_EMAILS.includes((user.email || '').toLowerCase())){
    document.getElementById('app').innerHTML = `
      <div class="card" style="text-align:center;">
        <p>이 화면은 관리자만 볼 수 있어요.<br><small style="color:var(--text-muted)">${esc(user.email || '')}</small></p>
        <button class="btn" onclick="auth.signOut()">다른 계정으로 로그인</button>
      </div>`;
    return;
  }
  start();
});
function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div class="card" style="text-align:center; padding:30px 16px;">
      <p style="margin:0 0 14px;">PJ 구글 계정(tourjang@gmail.com)으로 로그인해 주세요.</p>
      <button class="btn primary" onclick="googleLogin()">구글로 로그인</button>
    </div>`;
}
function googleLogin(){
  const p = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(p).catch(() => auth.signInWithRedirect(p));
}

/* ───── 데이터 ───── */
async function start(){
  // 기본: 지난달 (매달 10일에 지난달분 지급)
  const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - 1);
  month = kstMonth(d);
  try{
    const apps = await db.collection('tutorApplications').where('status', '==', 'approved').get();
    apps.forEach(doc => {
      const a = doc.data();
      if(a.tutorId) tutorInfo[a.tutorId] = { name: a.name || '', phone: a.phone || '', payoutAccount: a.payoutAccount || null };
    });
  }catch(e){ console.error('튜터 정보 불러오기 실패', e); }
  db.collection('completedLessons').onSnapshot(snap => {
    lessons = snap.docs.map(x => ({ id: x.id, ...x.data() }));
    render();
  }, err => {
    document.getElementById('app').innerHTML = `<p class="empty">완료 수업을 불러오지 못했어요.<br>${esc(err.message)}</p>`;
  });
}

function setMonth(v){ if(v){ month = v; render(); } }
function shiftMonth(n){
  const [y, m] = month.split('-').map(Number);
  const d = new Date(y, m - 1 + n, 1);
  month = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  render();
}
function toggle(id){ openSet.has(id) ? openSet.delete(id) : openSet.add(id); render(); }

function render(){
  const list = lessons.filter(l => monthOf(l) === month);
  const byTutor = {};
  list.forEach(l => { const k = l.tutorId || 'unknown'; (byTutor[k] = byTutor[k] || []).push(l); });

  let gross = 0, tutorTotal = 0;
  list.forEach(l => { const st = payoutState(l).key; if(st !== 'void'){ gross += grossOf(l); tutorTotal += payOf(l); } });

  let html = `
    <div class="monthbar">
      <button class="btn sm" onclick="shiftMonth(-1)">◀</button>
      <input type="month" value="${month}" onchange="setMonth(this.value)">
      <button class="btn sm" onclick="shiftMonth(1)">▶</button>
    </div>
    <div class="totals">
      <div class="tot"><small>${month} 수업료 합계</small><b>${won(gross)}</b></div>
      <div class="tot"><small>튜터 지급 (85%)</small><b>${won(tutorTotal)}</b></div>
      <div class="tot"><small>말문 몫 (15%)</small><b>${won(gross - tutorTotal)}</b></div>
    </div>`;

  const ids = Object.keys(byTutor);
  if(!ids.length){
    html += `<div class="card"><p class="empty">${month}에 완료된 수업이 없어요.</p></div>`;
  }
  ids.sort((a, b) => (byTutor[a][0].tutorName || '').localeCompare(byTutor[b][0].tutorName || ''));
  ids.forEach(tid => {
    const ls = byTutor[tid].sort((a, b) => ((a.completedAt && a.completedAt.toMillis ? a.completedAt.toMillis() : 0) - (b.completedAt && b.completedAt.toMillis ? b.completedAt.toMillis() : 0)));
    const info = tutorInfo[tid] || {};
    const name = ls[0].tutorName || info.name || tid;
    const c = { lesson:0, noshow:0, free:0, wait:0, dispute:0 };
    let okPay = 0, paidPay = 0, waitPay = 0;
    ls.forEach(l => {
      const st = payoutState(l).key;
      if(isFreeLesson(l)) c.free++; else if(l.kind === 'noshow') c.noshow++; else c.lesson++;
      if(st === 'ok') okPay += payOf(l);
      if(st === 'paid') paidPay += payOf(l);
      if(st === 'wait'){ waitPay += payOf(l); c.wait++; }
      if(st === 'dispute'){ waitPay += payOf(l); c.dispute++; }
    });
    const due = okPay;                       // 아직 안 보낸 확정 금액
    const w = withholding(due);
    const acct = info.payoutAccount;
    html += `
      <div class="card">
        <div class="tutor-head">
          <div>
            <p class="t-name">${esc(name)}</p>
            <p class="t-meta">정식 ${c.lesson}회 · 노쇼 ${c.noshow}회 · 무료 ${c.free}회${info.phone ? ' · ' + esc(info.phone) : ''}</p>
            ${acct ? `<span class="acct">🏦 ${esc(acct.bank)} ${esc(acct.number)} (${esc(acct.holder)})</span>` : `<span class="acct" style="color:var(--danger)">계좌 미등록 — 튜터 홈에서 등록하도록 안내해 주세요</span>`}
          </div>
          <button class="btn sm" onclick="toggle('${tid}')">${openSet.has(tid) ? '접기' : '수업 내역'}</button>
        </div>
        <table class="rows">
          ${c.wait || c.dispute ? `<tr><td>확인 대기 ${c.wait}건${c.dispute ? ` · <span style="color:var(--danger)">이의 ${c.dispute}건</span>` : ''}</td><td>${won(waitPay)}</td></tr>` : ''}
          ${paidPay ? `<tr><td>이미 지급 완료</td><td style="color:var(--blue)">${won(paidPay)}</td></tr>` : ''}
          <tr><td>지급할 확정 금액 (세전)</td><td>${won(due)}</td></tr>
          <tr><td>원천징수 3.3% (소득세 ${won(w.it)} + 지방세 ${won(w.lt)})</td><td>− ${won(w.total)}</td></tr>
          <tr class="big"><td>실제 보낼 금액</td><td>${won(due - w.total)}</td></tr>
        </table>
        <div style="margin-top:10px; text-align:right;">
          <button class="btn primary sm" ${due > 0 ? '' : 'disabled'} onclick="markPaid('${tid}', this)">이체했어요 → 지급 완료 처리</button>
        </div>
        <div class="detail ${openSet.has(tid) ? 'open' : ''}">
          ${ls.map(l => lessonRow(l)).join('')}
        </div>
      </div>`;
  });

  html += `<p class="note">· 원천징수 금액은 계산 참고용이에요. 실제 신고·납부는 홈택스나 세무사에게 확인해 주세요.<br>
    · 단가 기록이 없는 예전 수업은 30,000원 기준으로 계산돼요(목록에 "단가 추정" 표시).<br>
    · 지급 완료 처리는 "확정" 상태 수업만 바뀌어요. 확인 대기·이의 건은 그대로 남아요.</p>`;
  document.getElementById('app').innerHTML = html;
}

function lessonRow(l){
  const ps = payoutState(l);
  const kind = isFreeLesson(l) ? (l.isFreeTalk ? '무료 대화' : '무료 오리엔테이션') : (l.kind === 'noshow' ? '학생 노쇼' : '정식 수업');
  const est = (!isFreeLesson(l) && typeof l.unitPrice !== 'number' && typeof l.grossAmount !== 'number') || l.unitPriceEstimated;
  let disputeHtml = '';
  if(l.dispute){
    disputeHtml = `<p class="why">학생 이의: ${esc(l.dispute.reason || '')}</p>`;
    if(!l.dispute.resolved){
      disputeHtml += `<button class="btn sm ok" onclick="resolveDispute('${l.id}','pay')">지급 인정</button>
        <button class="btn sm no" onclick="resolveDispute('${l.id}','void')">지급 제외</button>`;
    }else{
      disputeHtml += `<p class="note">처리: ${l.dispute.resolved === 'pay' ? '지급 인정' : '지급 제외'}</p>`;
    }
  }
  return `<div class="lesson">
    <div class="l1"><span>${fmtDate(l.completedAt)} · ${esc(l.studentName || '학생')} · ${kind} <span class="st ${ps.key}">${ps.label}</span></span>
    <span>${isFreeLesson(l) ? '0원' : won(grossOf(l)) + ' → ' + won(payOf(l))}${est ? ' <small style="color:var(--text-muted)">(단가 추정)</small>' : ''}</span></div>
    ${disputeHtml}
  </div>`;
}

async function resolveDispute(id, how){
  const msg = how === 'pay' ? '이의를 정리하고 튜터에게 지급하는 것으로 처리할까요?' : '이 수업은 튜터에게 지급하지 않는 것으로 처리할까요?\n(학생 크레딧 환불은 따로 처리해 주세요)';
  if(!confirm(msg)) return;
  try{
    await db.collection('completedLessons').doc(id).update({
      'dispute.resolved': how,
      'dispute.resolvedAt': firebase.firestore.FieldValue.serverTimestamp()
    });
  }catch(e){ alert('처리 실패: ' + (e.message || e)); }
}

async function markPaid(tid, btn){
  const targets = lessons.filter(l => (l.tutorId || 'unknown') === tid && monthOf(l) === month && payoutState(l).key === 'ok');
  if(!targets.length) return;
  const total = targets.reduce((a, l) => a + payOf(l), 0);
  const w = withholding(total);
  if(!confirm(`${targets[0].tutorName || ''} 튜터 ${month} 정산\n\n확정 ${targets.length}건 · 세전 ${won(total)}\n실제 이체 ${won(total - w.total)}\n\n계좌 이체를 마쳤나요? 지급 완료로 바꿀게요.`)) return;
  btn.disabled = true; btn.textContent = '처리 중...';
  try{
    const batch = db.batch();
    const now = firebase.firestore.FieldValue.serverTimestamp();
    targets.forEach(l => batch.update(db.collection('completedLessons').doc(l.id), {
      payoutStatus: 'paid', paidAt: now, paidAmount: payOf(l), paidMonth: month
    }));
    await batch.commit();
  }catch(e){
    alert('처리 실패: ' + (e.message || e));
    btn.disabled = false; btn.textContent = '이체했어요 → 지급 완료 처리';
  }
}
</script>
</body>
</html>
