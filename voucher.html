<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>골프 부킹 바우처 — iCLARKGOLF</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--purple:#534AB7;--deep:#26215C;--mint:#1D9E75;--mint-light:#E1F5EE;--muted:#6b7280;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;background:#f4faf7;color:var(--deep);}
.v{max-width:560px;margin:18px auto;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 24px rgba(38,33,92,.12);}
.top{background:linear-gradient(135deg,#1D9E75,#534AB7);color:#fff;padding:22px 20px;}
.logo{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:2px;}
.logo .i{color:#ff4444;-webkit-text-fill-color:#ff4444;font-family:'Nunito',sans-serif;font-weight:800;font-size:24px;letter-spacing:0;}
.top h1{font-size:20px;margin-top:8px;}
.top p{font-size:12.5px;opacity:.85;margin-top:2px;}
.sec{padding:16px 20px;border-bottom:1px dashed #e5e7eb;}
.k{font-size:11.5px;color:var(--muted);font-weight:800;}
.val{font-size:16px;font-weight:800;margin-top:2px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.round{border:1.5px solid var(--mint-light);border-radius:12px;padding:12px;margin-top:10px;}
.round .d{font-size:13px;color:var(--purple);font-weight:800;}
.round .c{font-size:16px;font-weight:800;margin-top:2px;}
.round .c small{display:block;font-size:12px;color:var(--muted);font-weight:600;}
.round .t{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13.5px;}
.round .t b{font-size:18px;color:var(--mint);}
.note{background:#fffbeb;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.7;margin-top:8px;}
.foot{padding:16px 20px;font-size:13px;line-height:1.8;color:#374151;}
.btn{display:inline-block;margin-top:8px;background:#FEE500;color:#3c1e1e;border-radius:10px;padding:10px 14px;font-weight:800;text-decoration:none;}
.print{background:#fff;color:var(--purple);border:1.5px solid #AFA9EC;margin-left:6px;cursor:pointer;font-family:inherit;font-size:13px;}
@media print{body{background:#fff;}.v{box-shadow:none;margin:0;}.noprint{display:none!important;}}
</style>
</head>
<body>
<div class="v" id="v"><div class="sec" style="text-align:center;color:var(--muted);">바우처를 불러오는 중… / Loading…</div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const box = document.getElementById('v');
const id = new URLSearchParams(location.search).get('v') || '';
const wk = d => { if (!d) return ''; const t = new Date(d + 'T00:00:00'); return isNaN(t) ? '' : ' (' + '일월화수목금토'[t.getDay()] + ')'; };
try {
  if (!/^[a-z0-9]{8,40}$/i.test(id)) throw new Error('bad');
  const db = getFirestore(initializeApp({ apiKey:'AIzaSyCWoLpUqJ0qhVi3pFlfeB_aSIY4wtmy4qU', authDomain:'iclarkgolf.firebaseapp.com', projectId:'iclarkgolf' }));
  const s = await getDoc(doc(db, 'vouchers', id));
  if (!s.exists()) throw new Error('none');
  const v = s.data();
  box.innerHTML = `
  <div class="top"><div class="logo"><span class="i">i</span>CLARKGOLF</div><h1>⛳ 골프 부킹 바우처</h1><p>Golf Booking Voucher · ${esc(v.bookingId)}</p></div>
  <div class="sec grid">
    <div><div class="k">예약자 / Guest</div><div class="val">${esc(v.nameKo || '')}</div><div style="font-size:13px;font-weight:700;">${esc(v.nameEn)}</div></div>
    <div><div class="k">인원 / Golfers</div><div class="val">${v.golfers || '-'}명</div></div>
    <div><div class="k">바우처 번호 / Voucher No.</div><div class="val">${esc(v.voucherNo || v.bookingId)}</div></div>
    <div><div class="k">체류 / Stay</div><div class="val" style="font-size:14px;">${esc(v.arrDate || '-')} ~ ${esc(v.depDate || '-')}</div></div>
  </div>
  <div class="sec"><div class="k">라운드 / Rounds</div>
    ${(v.rounds || []).map((r, i) => `<div class="round"><div class="d">Round ${i+1} · ${esc(r.date)}${wk(r.date)}</div>
      <div class="c">${esc(r.courseKo || r.courseEn)}<small>${esc(r.courseKo ? r.courseEn : '')}</small></div>
      <div class="t"><span>티타임 / Tee time <b>${esc(r.teeTime || '-')}</b></span><span>인원 ${r.players || '-'}명</span>${r.confNo ? `<span>확인번호 ${esc(r.confNo)}</span>` : ''}</div></div>`).join('')}
    ${v.partnerNote ? `<div class="note">📌 ${esc(v.partnerNote)}</div>` : ''}
    ${v.originalUrl && /^https?:\/\//i.test(v.originalUrl) ? `<div style="margin-top:10px;"><a href="${esc(v.originalUrl)}" target="_blank" rel="noopener" style="color:var(--purple);font-weight:800;">📄 원본 바우처 보기 / Original voucher</a></div>` : ''}
  </div>
  <div class="foot">
    ✔️ 라운드 당일 <b>티타임 30분 전</b>까지 골프장 프런트에 도착해 이 화면(또는 인쇄본)을 보여주세요.<br>
    ✔️ 카트·캐디비와 캐디팁은 현장에서 따로 냅니다.<br>
    <span style="color:var(--muted);">Please present this voucher at the golf course front desk at least 30 minutes before your tee time.</span>
    <div class="noprint"><a class="btn" href="https://pf.kakao.com/_nbHKX/chat" target="_blank" rel="noopener">💬 문의: 카카오톡</a><button class="btn print" onclick="window.print()">🖨️ 인쇄 / 저장</button></div>
  </div>`;
} catch(e) {
  box.innerHTML = '<div class="sec" style="text-align:center;line-height:1.8;">바우처를 찾을 수 없어요.<br>받으신 링크를 다시 확인하시거나 카카오톡(tourjang2)으로 문의해 주세요.<br><span style="color:#6b7280;font-size:13px;">Voucher not found.</span></div>';
}
</script>
</body>
</html>
