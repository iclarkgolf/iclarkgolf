<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root{
    --bg: #FFF9F0;
    --card: #FFFFFF;
    --card-border: #E8E4D8;
    --text: #2C2C2A;
    --text-secondary: #5F5E5A;
    --text-muted: #8A8880;
    --accent: #EF9F27;
    --accent-text: #412402;
    --accent-soft: #FFF3E0;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:inherit; text-decoration:none; }
  .wrap{ max-width:480px; margin:0 auto; padding:24px 20px 40px; }

  .profile-row{ display:flex; align-items:center; gap:12px; padding:0 0 20px; }
  .top-row{ display:flex; justify-content:flex-end; padding:0 0 12px; }
  .lang-dropdown{ position:relative; }
  #langToggle{
    background:none; border:1px solid var(--card-border); color:var(--text-secondary);
    border-radius:16px; padding:6px 12px; font-size:12px; font-weight:600;
    cursor:pointer; display:flex; align-items:center; gap:4px;
  }
  #langToggle .cur{ color:var(--text); }
  #langToggle .caret{ font-size:10px; color:var(--text-muted); }
  .lang-menu{
    position:absolute; top:38px; right:0; z-index:30;
    background:var(--card, #fff); border:1px solid var(--card-border); border-radius:14px;
    box-shadow:0 8px 24px rgba(44,44,42,0.12); min-width:120px; padding:6px;
    display:none;
  }
  .lang-menu.open{ display:block; }
  .lang-menu .lang-option{
    display:block; padding:8px 10px; border-radius:8px;
    font-size:13px; color:var(--text); font-weight:500; cursor:pointer;
  }
  .lang-menu .lang-option:hover{ background:var(--accent-soft); }
  .lang-menu .lang-option.active{ color:var(--accent-text); background:var(--accent-soft); }
  .avatar{ width:44px; height:44px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:15px; font-weight:600; color:var(--accent-text); }
  .profile-row .name{ font-size:15px; font-weight:600; margin:0; }
  .profile-row .sub{ font-size:12px; color:var(--text-muted); margin:2px 0 0; }

  .next-lesson{
    background:var(--accent-soft); border:1px solid var(--card-border);
    border-radius:14px; padding:16px; margin-bottom:20px; cursor:pointer; width:100%; text-align:left;
  }
  .next-lesson .tag{ font-size:11px; color:var(--accent); margin:0 0 8px; }
  .next-lesson .row{ display:flex; justify-content:space-between; align-items:center; }
  .next-lesson .lesson-name{ font-size:14px; margin:0 0 3px; color:var(--text); }
  .next-lesson .lesson-time{ font-size:12px; color:var(--text-secondary); margin:0; }

  .stats{ display:flex; gap:10px; margin-bottom:20px; }
  .stat-card{ flex:1; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:14px; text-align:center; }
  .stat-card .num{ font-size:20px; font-weight:600; margin:0; }
  .stat-card .label{ font-size:11px; color:var(--text-muted); margin:4px 0 0; }

  .notice-box{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:16px 18px; margin-bottom:16px;
  }
  .notice-box h2{ font-size:13px; margin:0 0 12px; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.03em; }
  .notice-item{ padding:10px 0; border-top:1px solid var(--card-border); }
  .notice-item:first-of-type{ border-top:none; padding-top:0; }
  .notice-item-title{ font-size:13px; font-weight:700; margin:0 0 3px; display:flex; align-items:center; gap:6px; }
  .notice-new-dot{ width:6px; height:6px; border-radius:50%; background:var(--accent); display:inline-block; }
  .notice-item-body{ font-size:12px; color:var(--text-secondary); line-height:1.6; white-space:pre-wrap; margin:0; }
  .notice-item-date{ font-size:11px; color:var(--text-muted); margin-top:4px; }
  .notice-empty{ font-size:12px; color:var(--text-muted); }

  .menu-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 0; border-bottom:1px solid var(--card-border);
    cursor:pointer; background:none; border-left:none; border-right:none; border-top:none; width:100%; text-align:left; color:var(--text);
  }
  .menu-item span{ font-size:13px; color:var(--text); }
  .menu-item:last-child{ border-bottom:none; }
  .menu-item.danger span{ color:#D85A30; }

  .history-item{ display:flex; gap:10px; margin-bottom:10px; }
  .history-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; flex-shrink:0; }
  .history-card{ flex:1; background:var(--card); border:1px solid var(--card-border); border-radius:12px; padding:12px; }
  .history-date{ font-size:11px; color:var(--accent); font-weight:600; margin:0 0 4px; }
  .history-text{ font-size:13px; color:var(--text); margin:0 0 3px; }
  .history-sub{ font-size:12px; color:var(--text-secondary); margin:0; }
  .summary-block{ margin-top:8px; }
  .summary-label{ font-size:11px; color:var(--text-muted); font-weight:600; margin:8px 0 4px; }
  .summary-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .summary-chip{ background:var(--accent-soft); color:var(--accent-text); font-size:11px; padding:3px 9px; border-radius:8px; }
  .summary-goal{ font-size:12px; color:var(--text-secondary); margin:6px 0 0; }

  body{ padding-bottom:76px; }
  .bottom-nav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(255,255,255,0.92); backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    display:flex; padding:8px 8px calc(8px + env(safe-area-inset-bottom));
  }
  .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
    padding:6px 0; color:var(--text-muted); background:none; border:none; cursor:pointer;
  }
  .nav-item.active{ color:var(--accent); }
  .nav-item span{ font-size:11px; }
</style>

// 필리핀 통신망·카카오톡 등 인앱브라우저에서 Firestore 연결 실패 방지 (롱폴링 강제)

function formatDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function alertPlaceholder(kind){
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  const MSG = {
    history: {
      ko: '수업 내역/후기작성 화면으로 이동합니다.',

// 그 날짜가 속한 주의 월요일 자정을 반환 (주 단위 스트릭 계산용)
function getMonday(date){
  const d = new Date(date);
  const day = d.getDay(); // 0=일 ... 6=토
  const diff = (day === 0 ? -6 : 1) - day;
  d.setDate(d.getDate() + diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

// "수업 정리" 기록이 남은 주(week)들을 보고, 이번 주(또는 지난 주)부터 몇 주 연속인지 계산
function computeStreak(summaryEntries){
  const weekTimes = new Set();
  summaryEntries.forEach(e => {
    if(!e.createdAt) return;
    const d = e.createdAt.toDate ? e.createdAt.toDate() : new Date(e.createdAt);
    weekTimes.add(getMonday(d).getTime());
  });
  const sorted = Array.from(weekTimes).sort((a, b) => b - a);
  if(sorted.length === 0) return 0;
  const oneWeek = 7 * 24 * 60 * 60 * 1000;
  const thisMonday = getMonday(new Date()).getTime();
  const lastMonday = thisMonday - oneWeek;
  // 가장 최근 기록이 이번 주도 지난 주도 아니면 스트릭이 끊긴 것으로 봄
  if(sorted[0] !== thisMonday && sorted[0] !== lastMonday) return 0;
  let streak = 1;
  for(let i = 1; i < sorted.length; i++){
    if(sorted[i - 1] - sorted[i] === oneWeek){
      streak++;
    }else{
      break;
    }
  }
  return streak;
}

function renderHistoryEntry(entry){
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  const div = document.createElement('div');
  div.className = 'history-item';
  let text = '';
  let sub = '';
  if(entry.type === 'level_test'){
    const prefix = ({ ko: '레벨테스트 완료 — ', en: 'Level test complete — ', ja: 'レベルテスト完了 — ' })[lang];
    text = `${prefix}${entry.level} ${entry.stage}`;
    sub = entry.desc || '';
  } else {
    text = entry.text || ({ ko: '학습 활동', en: 'Learning activity', ja: '学習アクティビティ' })[lang];
    sub = entry.sub || '';
  }

  const SUMMARY_LABELS = {
    ko: { vocab: '📚 오늘의 단어', grammar: '✏️ 오늘의 표현', goal: '🎯 다음 목표: ' },
    en: { vocab: "📚 Today's words", grammar: "✏️ Today's expressions", goal: '🎯 Next goal: ' },
    ja: { vocab: '📚 今日の単語', grammar: '✏️ 今日の表現', goal: '🎯 次の目標：' }
  };
  const sl = SUMMARY_LABELS[lang] || SUMMARY_LABELS.ko;

  let summaryHtml = '';
  if(entry.type === 'lesson_summary'){
    const vocab = entry.vocab || [];
    const grammar = entry.grammar || [];
    summaryHtml = '<div class="summary-block">';
    if(vocab.length){
      summaryHtml += `<p class="summary-label">${sl.vocab}</p><div class="summary-chips">${vocab.map(v => `<span class="summary-chip">${escapeHtml(v)}</span>`).join('')}</div>`;
    }
    if(grammar.length){
      summaryHtml += `<p class="summary-label">${sl.grammar}</p><div class="summary-chips">${grammar.map(v => `<span class="summary-chip">${escapeHtml(v)}</span>`).join('')}</div>`;
    }
    if(entry.nextGoal){
      summaryHtml += `<p class="summary-goal">${sl.goal}${escapeHtml(entry.nextGoal)}</p>`;
    }
    summaryHtml += '</div>';
  }

  // 수업 완료/노쇼 후 72시간 안에는 학생이 이의를 신청할 수 있음 (정산 확정 전)
  const DL = {
    ko: { btn: '이 수업에 문제가 있었어요', done: '이의 신청 접수됨 — PJ가 확인하고 연락드려요' },
    en: { btn: 'Report a problem with this lesson', done: 'Report received — PJ will check and contact you' },
    ja: { btn: 'この授業に問題がありました', done: '申告を受け付けました — PJが確認してご連絡します' }
  }[lang] || {};
  let disputeHtml = '';
  if(entry.completedId && entry.disputed){
    disputeHtml = `<p class="history-sub" style="color:#C0492B;margin-top:6px;">${DL.done}</p>`;
  }else if(entry.completedId && entry.canDispute){
    disputeHtml = `<button onclick="openDispute('${entry.completedId}')" style="margin-top:8px;font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid #E8E4D8;background:#fff;color:#5F5E5A;cursor:pointer;font-family:inherit;">${DL.btn}</button>`;
  }

  div.innerHTML = `
    <div class="history-dot"></div>
    <div class="history-card">
      <p class="history-date">${formatDate(entry.createdAt)}</p>
      <p class="history-text">${text}</p>
      <p class="history-sub">${sub}</p>
      ${summaryHtml}
      ${disputeHtml}
    </div>
  `;
  return div;
}

async function openDispute(id){
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  const q = { ko: '어떤 문제가 있었나요? (예: 튜터가 오지 않았어요, 연결이 계속 끊겼어요)', en: 'What went wrong? (e.g. the tutor did not show up, the connection kept dropping)', ja: 'どんな問題がありましたか？（例：講師が来なかった、接続が何度も切れた）' }[lang];
  const reason = (prompt(q) || '').trim();
  if(!reason) return;
  try{
    const user = firebase.auth().currentUser;
    await db.collection('completedLessons').doc(id).update({
      dispute: { reason: reason, by: user ? user.uid : '', at: firebase.firestore.FieldValue.serverTimestamp() }
    });
    alert({ ko: '접수됐어요. PJ가 확인하고 연락드릴게요.', en: 'Received. PJ will check and get back to you.', ja: '受け付けました。PJが確認してご連絡します。' }[lang]);
    if(user) loadHistory(user.uid);
  }catch(e){
    alert('Error: ' + (e.message || e));
  }
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

async function loadHistory(uid){
  try{
    const snapshot = await db.collection('users').doc(uid).collection('history')
      .orderBy('createdAt', 'desc').limit(50).get();
    const container = document.getElementById('historyTimeline');

    let entries = snapshot.docs.map(doc => doc.data());

    // ── 튜터가 "수업 완료" 처리한 기록(completedLessons)을 학습 기록에 합친다 ──
    //    (튜터 페이지는 로그인 없이 쓰는 구조라 학생 history에 직접 못 쓰므로, 여기서 읽어와 합침)
    try{
      const doneSnap = await db.collection('completedLessons')
        .where('studentUid', '==', uid).get();
      const L = localStorage.getItem('malmun_lang') || 'ko';
      const doneEntries = doneSnap.docs.map(d => {
        const b = d.data();
        const doneMs = b.completedAt && b.completedAt.toMillis ? b.completedAt.toMillis() : 0;
        const paid = !(b.isFreeOrientation || b.isFreeTalk);
        const meta = { completedId: d.id, disputed: !!b.dispute,
          canDispute: paid && !b.dispute && doneMs > 0 && (Date.now() - doneMs) < 72*3600e3 };
        if(b.kind === 'noshow'){
          return { ...meta, type: 'noshow',
            text: ({ ko: `${b.tutorName || 'PJ'} 튜터 수업 — 결석(노쇼) 처리`, en: `Lesson with ${b.tutorName || 'PJ'} — marked as no-show`, ja: `${b.tutorName || 'PJ'}講師の授業 — 欠席（ノーショー）` })[L],
            sub: `${b.dayLabel || b.day || ''} ${b.time || ''}`, bookingId: d.id, createdAt: b.completedAt || b.createdAt || null };
        }
        return {
          ...meta,
          type: 'lesson_summary',
          text: `${b.tutorName || 'PJ'} 튜터와 수업 완료`,
          sub: `${b.dayLabel || b.day || ''} ${b.time || ''}${b.isFreeOrientation ? ' · 무료 오리엔테이션' : ''}`,
          vocab: b.vocab || [],
          grammar: b.grammar || [],
          nextGoal: b.nextGoal || '',
          bookingId: d.id,
          createdAt: b.completedAt || b.createdAt || null
        };
      });
      // history에 이미 같은 bookingId의 정리 기록이 있으면 중복 표시하지 않음
      const seen = new Set(entries.filter(e => e.type === 'lesson_summary' && e.bookingId).map(e => e.bookingId));
      entries = entries.concat(doneEntries.filter(e => !seen.has(e.bookingId)));
      const ts = e => (e.createdAt && e.createdAt.toMillis) ? e.createdAt.toMillis() : (e.createdAt ? new Date(e.createdAt).getTime() : 0);
      entries.sort((a, b) => ts(b) - ts(a));
    }catch(e){ console.warn('완료 수업 기록 불러오기 실패(무시):', e); }

    // ── 등급: 가장 최근 레벨테스트 기록에서 가져옴 (진짜 데이터) ──
    const latestLevelTest = entries.find(e => e.type === 'level_test');
    const levelLine = document.getElementById('userLevelLine');
    const langNow = localStorage.getItem('malmun_lang') || 'ko';
    if(latestLevelTest){
      levelLine.textContent = `${latestLevelTest.level} ${latestLevelTest.stage}`;
    }else{
      levelLine.textContent = ({
        ko: '레벨테스트를 먼저 진행해보세요',
        en: 'Try the level test first',
        ja: 'まずレベルテストを受けてみましょう'
      })[langNow];
    }

    // ── 예약한 수업 수: 실제 예약(booking) 기록 개수 ──
    const bookings = entries.filter(e => e.type === 'booking');
    document.getElementById('statLessonCount').textContent = bookings.length;

    // ── 연속 출석 스트릭: 튜터가 남긴 "수업 정리"(lesson_summary) 기록 기준 ──
    // 예약만으로는 실제로 수업을 들었는지 알 수 없어서, 튜터가 수업 후 노트를 남긴 주(week) 기준으로 계산합니다.
    const summaries = entries.filter(e => e.type === 'lesson_summary');
    document.getElementById('statStreak').textContent = computeStreak(summaries) + '주';

    // ── 다음 수업: 가장 최근 예약 기록을 그대로 사용 (진짜 데이터) ──
    if(bookings.length > 0){
      const latest = bookings[0];
      document.getElementById('nextLessonName').textContent =
        latest.text || ({ ko: '예약된 수업', en: 'Booked lesson', ja: '予約済みの授業' })[langNow];
      document.getElementById('nextLessonTime').textContent = latest.sub || '';
      const nextCard = document.getElementById('nextLessonCard');
      nextCard.style.display = 'block';
      document.getElementById('noLessonCard').style.display = 'none';
      if(latest.roomId){
        nextCard.onclick = () => {
          const params = new URLSearchParams({
            room: latest.roomId,
            tutor: latest.tutorName || '',
            time: latest.sub || ''
          });
          location.href = 'classroom.html?' + params.toString();
        };
      }else{
        // 예전 예약 기록(roomId 없음)은 안내만 표시
        nextCard.onclick = () => alert(({
          ko: '이 예약은 이전 방식이라 화상룸 정보가 없어요. 튜터에게 별도로 문의해주세요.',
          en: "This booking is from an older format without video room info. Please contact your tutor directly.",
          ja: 'この予約は以前の方式のため、ビデオルーム情報がありません。講師に直接お問い合わせください。'
        })[langNow]);
      }
    }else{
      document.getElementById('nextLessonCard').style.display = 'none';
      document.getElementById('noLessonCard').style.display = 'block';
    }

    // ── 진도율: 아직 실제 커리큘럼 진행 추적 시스템이 없어서, 예약한 수업 수를 기반으로
    // 임시 계산합니다. 커리큘럼 진행 추적을 만들면 이 계산식만 실제 값으로 바꾸면 됩니다.
    const progressPct = Math.min(100, bookings.length * 15);
    document.getElementById('statProgress').textContent = progressPct + '%';
    const stageNum = latestLevelTest ? latestLevelTest.stage : '';
    const progressLabel = ({ ko: '진도율', en: 'Progress', ja: '進捗率' })[langNow];
    document.getElementById('statProgressLabel').textContent = stageNum ? `${stageNum} ${progressLabel}` : progressLabel;

    if(entries.length === 0){
      return;
    }
    container.innerHTML = '';
    entries.forEach(entry => {
      container.appendChild(renderHistoryEntry(entry));
    });
  }catch(err){
    console.error('히스토리 로딩 실패:', err);
  }
}

auth.onAuthStateChanged((user) => {
  if(!user){
    location.href = 'login.html?next=mypage';
    return;
  }
  loadDisplayName(user);
  loadHistory(user.uid);
  claimPaidEnrollments(user.uid).then(() => loadCreditBalance(user.uid));
  loadNotices(user);
});

// ── 수강 신청 → PJ가 "입금 확인"한 건을 내 크레딧으로 자동 반영 (pricing·mypage·booking 공통) ──
async function claimPaidEnrollments(uid){
  try{
    const snap = await db.collection('enrollRequests').where('uid', '==', uid).get();
    const targets = snap.docs.filter(d => { const r = d.data(); return r.status === 'paid' && !r.claimed; });
    for(const d of targets){
      const ref = d.ref;
      await db.runTransaction(async tx => {
        const cur = await tx.get(ref);
        const r = cur.exists ? cur.data() : null;
        if(!r || r.status !== 'paid' || r.claimed) return;   // 이미 반영된 건은 건너뜀 (중복 충전 방지)
        const sessions = Number(r.sessions) || 0;
        if(!sessions) return;
        const expiresAt = new Date(Date.now() + 365 * 24 * 60 * 60 * 1000);
        tx.set(db.collection('users').doc(uid).collection('creditLots').doc(), {
          packageType: String(r.packageType || ''),
          totalSessions: sessions,
          remainingSessions: sessions,
          pricePaid: Number(r.price) || 0,
          regularPricePerSession: 30000,
          purchasedAt: firebase.firestore.FieldValue.serverTimestamp(),
          expiresAt: firebase.firestore.Timestamp.fromDate(expiresAt),
          enrollRequestId: ref.id
        });
        tx.set(db.collection('users').doc(uid).collection('history').doc(), {
          type: 'credit_purchase',
          text: `${sessions}회권 충전 완료 (${sessions}-lesson pack)`,
          sub: '₩' + Number(r.price || 0).toLocaleString('en-US'),
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        tx.update(ref, { claimed: true, claimedAt: firebase.firestore.FieldValue.serverTimestamp() });
      });
    }
  }catch(e){ console.error('입금 확인된 수강권 반영 실패:', e); }
}


async function markNoticesRead(notices, user){
  try{
    const batch = db.batch();
    notices.forEach(n => {
      const ref = db.collection('noticeReads').doc(`${n.id}_${user.uid}`);
      batch.set(ref, {
        noticeId: n.id,
        uid: user.uid,
        email: user.email || '',
        name: user.displayName || (user.email ? user.email.split('@')[0] : '학생'),
        audience: 'student',
        readAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    });
    await batch.commit();
  }catch(err){
    console.error('읽음 기록 저장 실패:', err);
  }
}

let _loadedNotices = null; // 언어를 바꾸면 다시 그리기 위해 보관
let _noticeLastSeen = 0;

// 학생 언어에 맞는 공지 제목·내용 (번역이 없으면 한국어)
function noticeText(n, lang){
  const t = (lang === 'en' || lang === 'ja') ? n[lang] : null;
  return {
    title: (t && t.title) || n.title || '',
    body: (t && t.body) || n.body || ''
  };
}

function renderNotices(){
  if(!_loadedNotices || _loadedNotices.length === 0) return;
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  const dateLocale = { ko: 'ko-KR', en: 'en-US', ja: 'ja-JP' }[lang] || 'ko-KR';
  document.getElementById('noticeList').innerHTML = _loadedNotices.map(n => {
    const ts = n.createdAt && n.createdAt.toMillis ? n.createdAt.toMillis() : 0;
    const isNew = ts > _noticeLastSeen;
    const date = n.createdAt && n.createdAt.toDate ? n.createdAt.toDate().toLocaleDateString(dateLocale) : '';
    const tx = noticeText(n, lang);
    return `
        <div class="notice-item">
          <p class="notice-item-title">${isNew ? '<span class="notice-new-dot"></span>' : ''}${escapeHtml(tx.title)}</p>
          <p class="notice-item-body">${escapeHtml(tx.body)}</p>
          <p class="notice-item-date">${date}</p>
        </div>
      `;
  }).join('');
}

async function loadNotices(user){
  const lang = localStorage.getItem('malmun_lang') || 'ko';
  try{
    const snap = await db.collection('notices')
      .where('audience', '==', 'student')
      .orderBy('createdAt', 'desc')
      .limit(5)
      .get();
    const notices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const lastSeen = Number(localStorage.getItem('malmun_student_notice_last_seen') || 0);
    const el = document.getElementById('noticeList');
    if(notices.length === 0){
      el.innerHTML = `<p class="notice-empty">${({
        ko: '등록된 공지가 없어요.', en: 'No notices yet.', ja: 'まだお知らせはありません。'
      })[lang]}</p>`;
      return;
    }
    _loadedNotices = notices;
    _noticeLastSeen = lastSeen;
    renderNotices();
    const latestTs = notices[0].createdAt && notices[0].createdAt.toMillis ? notices[0].createdAt.toMillis() : Date.now();
    localStorage.setItem('malmun_student_notice_last_seen', String(latestTs));
    if(user){ markNoticesRead(notices, user); }
  }catch(err){
    console.error('공지 불러오기 실패:', err);
    document.getElementById('noticeList').innerHTML = `<p class="notice-empty">${({
      ko: '공지를 불러오지 못했어요.', en: 'Could not load notices.', ja: 'お知らせを読み込めませんでした。'
    })[lang]}</p>`;
  }
}

function fmtCreditDate(d){
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

async function loadCreditBalance(uid){
  try{
    const snap = await db.collection('users').doc(uid).collection('creditLots').get();
    const now = new Date();
    let total = 0;
    let nearestExpiry = null;
    snap.forEach(doc => {
      const d = doc.data();
      const expiresAt = d.expiresAt && d.expiresAt.toDate ? d.expiresAt.toDate() : null;
      const remaining = d.remainingSessions || 0;
      if(remaining > 0 && (!expiresAt || expiresAt > now)){
        total += remaining;
        if(expiresAt && (!nearestExpiry || expiresAt < nearestExpiry)) nearestExpiry = expiresAt;
      }
    });
    const lang = localStorage.getItem('malmun_lang') || 'ko';
    const creditCard = document.getElementById('creditCard');
    const noCreditCard = document.getElementById('noCreditCard');
    if(total > 0){
      creditCard.style.display = 'block';
      noCreditCard.style.display = 'none';
      document.getElementById('creditNum').textContent =
        ({ ko: `${total}회 남음`, en: `${total} lessons left`, ja: `残り${total}回` })[lang];
      if(nearestExpiry){
        document.getElementById('creditExpiry').textContent =
          ({
            ko: `${fmtCreditDate(nearestExpiry)}까지`,
            en: `Valid until ${fmtCreditDate(nearestExpiry)}`,
            ja: `${fmtCreditDate(nearestExpiry)}まで`
          })[lang];
      }
    }else{
      creditCard.style.display = 'none';
      noCreditCard.style.display = 'block';
    }
  }catch(err){
    console.error('크레딧 잔액 조회 실패:', err);
  }
}

async function loadDisplayName(user){
  const fallback = user.displayName || (user.email ? user.email.split('@')[0] : '학습자');
  let shownName = fallback;
  try{
    const profileDoc = await db.collection('users').doc(user.uid).get();
    if(profileDoc.exists && profileDoc.data().malmunDisplayName){
      shownName = profileDoc.data().malmunDisplayName;
    }
  }catch(err){
    console.error('표시 이름 불러오기 실패:', err);
  }
  document.getElementById('userName').textContent = shownName;
  document.getElementById('avatarInitial').textContent = shownName.charAt(0).toUpperCase();

  document.getElementById('editNameBtn').addEventListener('click', () => {
    const lang = localStorage.getItem('malmun_lang') || 'ko';
    const promptText = ({
      ko: '말문에서 사용할 이름을 입력하세요',
      en: 'Enter the name you want to use on Malmun',
      ja: 'マルムンで使用する名前を入力してください'
    })[lang];
    const newName = prompt(promptText, shownName);
    if(newName === null) return;
    const trimmed = newName.trim();
    if(!trimmed) return;
    db.collection('users').doc(user.uid).set({ malmunDisplayName: trimmed }, { merge: true })
      .then(() => {
        document.getElementById('userName').textContent = trimmed;
        document.getElementById('avatarInitial').textContent = trimmed.charAt(0).toUpperCase();
      })
      .catch(err => {
        console.error('이름 저장 실패:', err);
        alert(({ ko: '이름 저장에 실패했습니다: ', en: 'Failed to save name: ', ja: '名前の保存に失敗しました：' })[lang] + err.message);
      });
  });
}

function handleLogout(){
  auth.signOut().then(() => {
    location.href = 'index.html';
  });
}

function applyLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const dict = TRANSLATIONS[lang] || TRANSLATIONS.ko;
    if(dict[key] !== undefined){
      el.innerHTML = dict[key];
    }
  });
  const LANG_LABELS = { ko: '한국어', en: 'English', ja: '日本語' };
  document.getElementById('langCur').textContent = LANG_LABELS[lang] || LANG_LABELS.ko;
  document.querySelectorAll('.lang-menu .lang-option').forEach(el => {
    el.classList.toggle('active', el.getAttribute('data-lang') === lang);
  });
  localStorage.setItem('malmun_lang', lang);
}

function toggleLangMenu(e){
  e.stopPropagation();
  document.getElementById('langMenu').classList.toggle('open');
}
function setLang(e, lang){
  e.stopPropagation();
  applyLang(lang);
  document.getElementById('langMenu').classList.remove('open');
  renderNotices(); // 공지도 바꾼 언어로 다시 표시
}
document.addEventListener('click', () => {
  const menu = document.getElementById('langMenu');
  if(menu) menu.classList.remove('open');
});

(function initLang(){
  const saved = localStorage.getItem('malmun_lang') || 'ko';
  applyLang(saved);
  const loadingEl = document.getElementById('noticeLoading');
  if(loadingEl){
    loadingEl.textContent = ({ ko: '불러오는 중...', en: 'Loading...', ja: '読み込み中...' })[saved] || '불러오는 중...';
  }
})();
</script>
<script>
// ── 무료 대화 요청 상태 카드 (기존 마이페이지 로직과 분리된 별도 블록) ──
(function(){
  const TXT = {
    ko: { tag:'💬 무료 대화 요청', pending:'⏳ 튜터가 확인 중이에요', accepted:'✅ 수락됐어요! 눌러서 화상룸 입장', declined:'🙏 이번 시간은 어렵대요 · 다시 요청하기' },
    en: { tag:'💬 Free chat request', pending:'⏳ Waiting for the tutor', accepted:'✅ Accepted! Tap to enter the video room', declined:"🙏 That time doesn't work · Request again" },
    ja: { tag:'💬 無料トークのリクエスト', pending:'⏳ 講師が確認中です', accepted:'✅ 承認されました！タップしてビデオルームへ', declined:'🙏 この時間は難しいそうです · 再リクエスト' }
  };
  const DAY = { mon:['월요일','Mon','月'], tue:['화요일','Tue','火'], wed:['수요일','Wed','水'], thu:['목요일','Thu','木'], fri:['금요일','Fri','金'], sat:['토요일','Sat','土'], sun:['일요일','Sun','日'] };
  auth.onAuthStateChanged(user => {
    if(!user) return;
    db.collection('freeTalkRequests').where('studentUid', '==', user.uid).onSnapshot(snap => {
      const card = document.getElementById('freeTalkCard');
      if(snap.empty){ card.style.display = 'none'; return; }
      const ts = r => (r.createdAt && r.createdAt.toMillis) ? r.createdAt.toMillis() : Date.now();
      const r = snap.docs.map(d => d.data()).sort((a, b) => ts(b) - ts(a))[0];
      const lang = localStorage.getItem('malmun_lang') || 'ko';
      const t = TXT[lang] || TXT.ko;
      const li = { ko:0, en:1, ja:2 }[lang] || 0;
      document.getElementById('freeTalkTag').textContent = t.tag;
      document.getElementById('freeTalkStatus').textContent = t[r.status] || t.pending;
      document.getElementById('freeTalkWhen').textContent = `${(DAY[r.day] || [''])[li] || ''} ${r.time || ''} (KST) · ${r.tutorName || 'PJ'}`;
      card.style.display = 'block';
      card.onclick = () => {
        if(r.status === 'accepted' && r.roomId){
          const p = new URLSearchParams({ room: r.roomId, tutor: r.tutorName || 'PJ', time: `${r.dayLabel || ''} ${r.time || ''}` });
          location.href = 'classroom.html?' + p.toString();
        }else{
          location.href = 'free-talk.html';
        }
      };
    }, err => console.warn('무료 대화 요청 불러오기 실패(무시):', err));
  });
})();
</script><script>
// ── 튜터로 지원/승인된 계정이면 "튜터 마이페이지" 카드를 보여줌 (학생 기능은 그대로) ──
(function(){
  auth.onAuthStateChanged(async (user) => {
    if(!user) return;
    try{
      let snap = await db.collection('tutorApplications').where('uid', '==', user.uid).limit(1).get();
      if(snap.empty && user.email){
        snap = await db.collection('tutorApplications').where('email', '==', user.email).limit(1).get();
      }
      if(snap.empty) return;
      const a = snap.docs[0].data();
      const card = document.getElementById('tutorHomeCard');
      if(!card) return;
      if((a.status || 'pending') !== 'approved'){
        document.getElementById('tutorHomeTitle').textContent = '튜터 지원서 확인 · 수정 →';
        document.getElementById('tutorHomeSub').textContent = a.status === 'rejected' ? '지원 결과를 확인해주세요' : '지금 검토 중이에요. 승인되면 튜터 메뉴가 열려요';
      }
      card.style.display = 'block';
    }catch(err){ console.error('튜터 여부 확인 실패:', err); }
  });
})();
</script>
