const CAT_EN = { '드라이버':'Driver','우드':'Fairway Wood','유틸리티':'Hybrid / Utility','아이언':'Irons','웨지':'Wedge','퍼터':'Putter','풀세트':'Full Set','골프백':'Golf Bag','의류·기타':'Apparel & Others' };
const COND_EN = { '새것 (미사용)':'New (unused)','아주 좋음 (사용감 거의 없음)':'Excellent (barely used)','좋음 (잔기스 약간)':'Good (minor scratches)','보통 (사용감 있음)':'Fair (visible wear)','사용감 많음':'Well used' };
const GEN_EN = { '국내 정품':'Genuine (Korea model)','일본 정품':'Genuine (Japan model)','미국 정품':'Genuine (US model)','정품 (구분 모름)':'Genuine' };
const LOC_EN = { '한국 (서울)':'Korea (Seoul) — brought to Clark on request','필리핀 클락':'Clark, Philippines' };

function pickLang(){
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'en' || q === 'kr') return q;
  try { const s = localStorage.getItem('clarkgo_lang'); if (s === 'en' || s === 'kr') return s; } catch(e) {}
  return /^ko/i.test(navigator.language || '') ? 'kr' : 'en';
}

const L = () => T[LANG];

let ITEMS = [], USD_KRW = 1380, KRW_PER_PHP = 0, CUR_CAT = '전체', CUR = null, FB_PAGES = [];

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function won(n){ return '₩' + (Number(n)||0).toLocaleString(); }
function usdOf(krw){ return Math.ceil((Number(krw)||0) / USD_KRW * (1 + CARD_FEE_RATE)); }
/* 페소 가격: 관리자에서 직접 넣은 값이 있으면 그것, 없으면 원화 ÷ 환율(관리자 환율 설정)을 50페소 단위로 올림 */
function phpOf(it){
  if (Number(it.pricePhp) > 0) return Number(it.pricePhp);
  if (!KRW_PER_PHP) return 0;
  return Math.ceil((Number(it.priceKrw)||0) / KRW_PER_PHP / 50) * 50;
}
function peso(n){ return '₱' + (Number(n)||0).toLocaleString(); }
function nameOf(it){
  if (LANG === 'kr') return it.name;

  return it.brand ? it.brand + ' ' + c : c;
}
function partsOf(it){
  const P = L().parts, out = [];
  if (it.withShaft === false) out.push(P.head);
  if (it.withCover) out.push(P.cover);
  if (it.withWrench) out.push(P.wrench);
  return out.join(' · ');
}
function specLine(it){ return [it.loft ? it.loft + '°' : '', it.flex || '', it.withShaft === false ? L().parts.head : ''].filter(Boolean).join(' · '); }
function catOf(c){ return LANG === 'en' ? (CAT_EN[c] || c) : c; }
function priceMain(it){ return LANG === 'en' && phpOf(it) ? peso(phpOf(it)) : won(it.priceKrw); }
function priceSub(it){ return LANG === 'en' && phpOf(it) ? '≈ ' + won(it.priceKrw) : L().cardPrice(usdOf(it.priceKrw).toLocaleString()); }
function fv(v){
  if (!v) return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return v.timestampValue;
  if ('nullValue' in v) return null;
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(fv);
  if ('mapValue' in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = fv(f[k]); return o; }
  return null;
}
async function getSetting(name){
  const r = await fetch(FS + name + KEY, { cache: 'no-store' });
  if (!r.ok) return null;
  const j = await r.json(); const o = {}; const f = j.fields || {};
  for (const k in f) o[k] = fv(f[k]);
  return o;
}
function toast(m){ const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2200); }

async function load(){
  try {
    const [shop, ex] = await Promise.all([getSetting('shop'), getSetting('exchange')]);
    if (ex && Number(ex.usdKrw)) USD_KRW = Number(ex.usdKrw);
    if (ex && Number(ex.usdKrw)) KRW_PER_PHP = Number(ex.usdKrw) / (Number(ex.appliedUsdPhp) || 53.2);
    ITEMS = ((shop && shop.items) || []).filter(it => it && it.visible !== false && it.name);
    const ord = { sale:0, reserved:1, sold:2 };
    ITEMS.sort((a,b) => (ord[a.status||'sale'] - ord[b.status||'sale']) || ((b.createdAt||0) - (a.createdAt||0)));
  } catch(e) { console.warn('상품 불러오기 실패', e); ITEMS = []; }
  // 페이스북 미리보기용 개별 페이지 목록 (6시간마다 자동 생성 — 없으면 일반 링크로 공유)

  renderChips(); renderList();

  if (q) { const it = ITEMS.find(x => x.id === q); if (it) openMd(it.id); }
}

/* 페이스북 공유: 사진·이름·가격이 미리보기로 뜨는 개별 페이지(shop-아이디.html)가 있으면 그 주소로 */

function openBuy(){
  const it = CUR, F = L().f;
  const rcv = (it.receive && it.receive.length ? it.receive : ['ship']).filter(k => T.kr.rcv[k]).filter(k => !(LANG === 'en' && k === 'ship'));
  if (!rcv.length) rcv.push('clark');
  const buy = document.getElementById('buy');
  buy.innerHTML = `
    <h3>${esc(F.title(nameOf(it)))}</h3>
    <div class="f"><label>${F.name}</label><input type="text" id="bName" autocomplete="name"></div>
    <div class="f"><label>${F.phone}</label><input type="tel" id="bPhone" autocomplete="tel" placeholder="${F.phonePh}"></div>
    <div class="f"><label>${F.rcv}</label><div class="rcv">${rcv.map((k,i) => `<label><input type="radio" name="bRcv" value="${k}"${i?'':' checked'}><span><b>${L().rcv[k]}</b>${k==='ship' ? (Number(it.shipKrw) ? ' — ' + L().shipFee(won(it.shipKrw)).trim() : ' — ' + L().shipIncl.trim()) : ''}${k==='meet' && (it.place || it.location) ? '<br><small>' + esc(L().meetNear(it.place || (LANG==='en' ? (LOC_EN[it.location]||it.location).split(' —')[0] : it.location))) + '</small>' : (L().rcvD[k] ? '<br><small>' + L().rcvD[k] + '</small>' : '')}</span></label>`).join('')}</div></div>
    <div class="f" id="bAddrF"><label>${F.addr}</label><input type="text" id="bAddr" autocomplete="street-address" placeholder="${F.addrPh}"></div>
    <div class="f"><label>${F.memo}</label><textarea id="bMemo" rows="2" placeholder="${rcv.includes('clark') ? F.memoClark : F.memoShip}"></textarea></div>
    <div class="sum" id="bSum"></div>
    <label class="agree"><input type="checkbox" id="bAgree"><span>${F.agree}</span></label>

    <div id="bPay" style="min-height:48px;"></div>`;
  buy.style.display = 'block';

function curRcv(){ const r = document.querySelector('input[name=bRcv]:checked'); return r ? r.value : 'ship'; }
function totalKrw(){ return (Number(CUR.priceKrw)||0) + (curRcv()==='ship' ? (Number(CUR.shipKrw)||0) : 0); }
function updSum(){
  const F = L().f;
  const ship = curRcv()==='ship' && Number(CUR.shipKrw);
  document.getElementById('bAddrF').style.display = curRcv()==='ship' ? 'block' : 'none';
  const itemPrice = LANG === 'en' && phpOf(CUR) ? peso(phpOf(CUR)) + ' (' + won(CUR.priceKrw) + ')' : won(CUR.priceKrw);
  document.getElementById('bSum').innerHTML =
    `<div class="row"><span>${F.item}</span><span>${itemPrice}</span></div>` +
    (ship ? `<div class="row"><span>${F.ship}</span><span>${won(CUR.shipKrw)}</span></div>` : '') +
    `<div class="row tot"><span>${F.total}</span><span>US$${usdOf(totalKrw()).toLocaleString()}</span></div>
     <div style="font-size:11.5px;color:#6b7280;margin-top:4px;">${F.basis(won(totalKrw()))}</div>`;
}
function checkForm(){
  const F = L().f;
  const name = document.getElementById('bName').value.trim();
  const phone = document.getElementById('bPhone').value.replace(/[^0-9+]/g,'');
  const addr = document.getElementById('bAddr').value.trim();
  let msg = '';
  if (!name) msg = F.eName;
  else if (phone.length < 9) msg = F.ePhone;
  else if (curRcv()==='ship' && addr.length < 6) msg = F.eAddr;
  else if (!document.getElementById('bAgree').checked) msg = F.eAgree;
  const e = document.getElementById('bErr');
  e.textContent = msg; e.style.display = msg ? 'block' : 'none';
  return !msg;
}
function loadPaypal(){
  if (window.paypal) return Promise.resolve(window.paypal);
  return new Promise((ok, no) => {
    const sc = document.createElement('script');
    sc.src = 'https://www.paypal.com/sdk/js?client-id=' + encodeURIComponent(PAYPAL_CLIENT_ID) + '&currency=USD&intent=capture&components=buttons&disable-funding=paylater,venmo';
    sc.onload = () => ok(window.paypal); sc.onerror = no;
    document.head.appendChild(sc);
  });
}
let _order = null;
function renderPay(){
  loadPaypal().then(pp => pp.Buttons({
    style: { layout:'vertical', shape:'rect', label:'pay' },
    onClick: async (d, actions) => {
      if (!checkForm()) return actions.reject();
      try {
        const shop = await getSetting('shop');
        const now = ((shop && shop.items) || []).find(x => x.id === CUR.id);
        if (!now || (now.status || 'sale') !== 'sale' || now.visible === false) {
          const e = document.getElementById('bErr'); e.textContent = L().f.eGone; e.style.display = 'block';
          return actions.reject();
        }
        if (Number(now.priceKrw) !== Number(CUR.priceKrw) || Number(now.shipKrw||0) !== Number(CUR.shipKrw||0)) { Object.assign(CUR, now); updSum(); }
      } catch(e) {}
      _order = {
        name: document.getElementById('bName').value.trim(),
        phone: document.getElementById('bPhone').value.trim(),
        rcv: curRcv(),
        addr: curRcv()==='ship' ? document.getElementById('bAddr').value.trim() : '',
        memo: document.getElementById('bMemo').value.trim(),
        krw: totalKrw(), usd: usdOf(totalKrw()), lang: LANG
      };
      return actions.resolve();
    },
    createOrder: (d, actions) => actions.order.create({
      purchase_units: [{
        description: ('iCLARKGOLF used: ' + (CUR.nameEn || CUR.name)).slice(0, 120),
        invoice_id: 'SHOP-' + CUR.id + '-' + Date.now(),
        amount: { currency_code: 'USD', value: _order.usd.toFixed(2) }
      }],
      application_context: { shipping_preference: 'NO_SHIPPING', brand_name: 'iCLARKGOLF' }
    }),
    onApprove: (d, actions) => actions.order.capture().then(order => {
      const o = Object.assign({}, _order), it = CUR;
      const r = L().rcv[o.rcv].replace(/^\S+\s/,'');
      document.getElementById('buy').innerHTML = `<div class="ok">${L().f.done(o.usd.toLocaleString(), esc(o.phone), r)}</div>`;
      notifyBuy(it, o, order);
    }),
    onError: err => { console.error('PayPal 오류', err); alert(L().f.payFail); }
  }).render('#bPay')).catch(() => {
    document.getElementById('bPay').innerHTML = `<div style="font-size:12.5px;color:#b91c1c;">${L().f.payLoadFail}</div>`;
  });
}
async function notifyBuy(it, o, order){
  try {
    const n = await getSetting('notify');
    if (!n || !n.web3formsKey) return;
    await fetch('https://api.web3forms.com/submit', {
      method: 'POST', headers: { 'Content-Type':'application/json', 'Accept':'application/json' },
      body: JSON.stringify({
        access_key: n.web3formsKey,
        subject: '🏷️ [iCLARKGOLF 중고장터] 판매 완료 — ' + it.name + ' US$' + o.usd + (o.lang === 'en' ? ' (영어 손님)' : ''),
        from_name: 'iCLARKGOLF 중고장터',
        '물건': it.name + (it.brand ? ' (' + it.brand + ')' : ''),
        '물건 ID': it.id,
        '손님 화면 언어': o.lang === 'en' ? 'ENG (필리핀 등 외국 손님)' : '한국어',
        '결제금액': 'US$' + o.usd + ' (원화 ' + won(o.krw) + ' 기준, 카드 수수료 4% 포함)',
        '받는 분': o.name,
        '휴대폰': o.phone,
        '받는 방법': T.kr.rcv[o.rcv],
        '주소': o.addr || '-',
        '요청 사항': o.memo || '-',
        'PayPal 주문번호': order.id || '-',
        '결제자 이메일': (order.payer && order.payer.email_address) || '-',
        '결제시각': new Date().toLocaleString('ko-KR', { timeZone:'Asia/Seoul' }),
        '할 일': '① 관리자 > 중고장터에서 이 물건을 "판매완료"로 바꾸기 ② 구매자에게 전화/문자 ③ 발송·전달'
      })
    });
  } catch(e) { console.warn('판매 알림 실패(무시)', e); }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeMd(); });
setLang(LANG);
load();
</script>
